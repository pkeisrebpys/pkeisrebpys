      <h2>研究紹介</h2>
      <img src="IMG_0100.JPG" alt="実験風景の写真" style="width:200px;float:left;">
      <p>再生可能エネルギー電源の導入拡大に伴い、
      電力系統は慣性力の低下や電圧変動といった問題が生じています。
      これらの問題をパワーエレクトロニクス回路、
      特に、既存の家電製品に内蔵された回路を用いて、
      追加機器なしに対策できないか検討しています。</p>
